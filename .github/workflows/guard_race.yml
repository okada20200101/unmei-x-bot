name: guard race test
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: bash automation/x_daily/claim.sh test:race9
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: bash automation/x_daily/claim.sh test:race9
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: 死んだクレームを仕込んで引き継ぎを検証
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name x-bot
          git config user.email x-bot@users.noreply.github.com
          mkdir -p automation/x_daily/claims/_test
          echo "key=test:stale run=39509113345 started=2026-10-20T22:30:00Z" > automation/x_daily/claims/_test/stale.lock
          git add -A && git commit -q -m "seed stale lock"
          git push origin HEAD:main -q
          bash automation/x_daily/claim.sh test:stale
