name: diag2
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: dump material server
        env:
          POSTS: ${{ secrets.POSTS_ENDPOINT }}
          ADV: ${{ secrets.ADVANCE_ENDPOINT }}
          TOK: ${{ secrets.ADVANCE_TOKEN }}
        run: |
          set -x
          python3 - <<'PY'
          import os,json,urllib.request
          P=os.environ["POSTS"]; A=os.environ.get("ADV","")
          print("[url] POSTS =",P)
          print("[url] ADV   =",A)
          def get(u,tok=None):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*",**({"x-token":tok} if tok else {})})
              with urllib.request.urlopen(r,timeout=30) as x:
                  return x.status,dict(x.headers),x.read()
          s,h,b=get(P)
          print("[today] status",s,"ctype",h.get("content-type"))
          print("[today] body",b[:2500].decode("utf-8","replace"))
          base=P.rsplit("/",1)[0]
          for q in ["/today?n=13","/today?n=14","/today?n=15","/today?n=20","/today?n=100"]:
              try:
                  s2,h2,b2=get(base+q)
                  print("[probe]",q,s2,b2[:400].decode("utf-8","replace"))
              except Exception as e:
                  print("[probe]",q,"ERR",repr(e)[:120])
          for q in ["/media","/media?n=13","/media?n=99"]:
              try:
                  s3,h3,b3=get(base+q)
                  print("[media]",q,s3,h3.get("content-type"),len(b3))
              except Exception as e:
                  print("[media]",q,"ERR",repr(e)[:120])
          for q in ["/list","/all","/manifest","/status","/count"]:
              try:
                  s4,h4,b4=get(base+q)
                  print("[meta]",q,s4,b4[:300].decode("utf-8","replace"))
              except Exception as e:
                  print("[meta]",q,"ERR",repr(e)[:80])
          PY
