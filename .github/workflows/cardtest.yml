name: cardtest
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render 3 cards
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1 || echo "[warn] fonts"
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          cd automation/x_daily
          python3 -c "
          from rotation import payload
          from card import render_card
          import datetime
          d=datetime.date(2026,10,21)
          for i in range(3):
              it=payload(d+datetime.timedelta(days=i))
              p=render_card(it, f'card{i}.png')
              print('[ok]', it['date'], it['ganshi'], it['persona'], p.stat().st_size)
          "
          python3 -c "
          from rotation import payload
          print('[post1]'); print(payload('2026-10-21')['post1'])
          print('[post2]'); print(payload('2026-10-21')['post2'])
          "
      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            automation/x_daily/card0.png
            automation/x_daily/card1.png
            automation/x_daily/card2.png
