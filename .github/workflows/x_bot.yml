name: X daily post (unmei / @unmei_meishiki_)

# 毎朝 5:00 JST = 20:00 UTC（前日）。JST = UTC+9。
# 対象アカウント: @unmei_meishiki_（@iching_kobo とは別アカウント・完全独立）
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 投稿せず検証だけ"
        default: "0"

concurrency:
  group: x-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily poster
        env:
          TZ: Asia/Tokyo
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}   # @unmei_meishiki_ のセッション(storage_state JSON)
          POSTS_ENDPOINT:   ${{ secrets.POSTS_ENDPOINT }}   # 当日の1本を返すURL
          ADVANCE_ENDPOINT: ${{ secrets.ADVANCE_ENDPOINT }} # 投稿後にカーソルを進めるURL
          ADVANCE_TOKEN:    ${{ secrets.ADVANCE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: bash automation/x_daily/ci.sh
      - name: Upload log & state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-daily-state
          path: |
            automation/x_daily/state.json
            automation/x_daily/last_run.log
          if-no-files-found: ignore
