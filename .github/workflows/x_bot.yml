name: x daily post (unmei / @unmei_meishiki_)

# ============================================================
#  毎朝 05:00 JST に「1本だけ」投稿する。JST = UTC+9。
#
#  二重投稿を許さない仕組み（2026-10-21 実装）:
#   1) 5:00 までの待機（WAIT_UNTIL）で投稿時刻を固定
#   2) 投稿直前に claims/<JST日付>.lock を git push で原子的に取得
#      → 同時に何本来ても「投稿まで到達するのは1本」
#   3) 取得できなかった実行は BUSY として待機し、先行実行が死んでいれば
#      GitHub API で生死を確認して引き継ぐ（投稿ゼロを作らない）
#   4) 投稿が成立した瞬間に last_post.txt を確定・push（後続失敗で重複しない）
#   5) 投稿に至らなかった場合だけクレームを返却（次の窓が引き継ぐ）
#
#  cron を6本置く理由:
#   GitHub schedule は実測 +2h41m〜+5h39m 遅れる。1本では 05:00 を跨げない。
#   窓を重ね、どれか1本が 05:00 前に起動すればよい。05:00 以降の窓は
#   「まだ投稿されていなければ即投稿する」保険（=投稿ゼロの防止）。
# ============================================================

on:
  schedule:
    # 23:00 / 00:30 / 02:00 / 06:30 JST（主経路：5:00 を狙う）
    - cron: "0 14 * * *"
    - cron: "30 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 21 * * *"
    # 08:00 / 12:30 JST（保険：未投稿なら即投稿）
    - cron: "0 23 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 投稿せず検証だけ"
        default: "0"
      probe:
        description: "1 = 添付テストのみ (投稿しない)"
        default: "0"
      require_media:
        description: "1 = 動画が付かなければ投稿せず中止"
        default: "0"
      wait_until:
        description: "HH:MM (JST) まで待ってから投稿。空なら 05:00"
        default: ""
      force_date:
        description: "検証用 YYYY-MM-DD（空なら今日）"
        default: ""

concurrency:
  group: x-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 排他・待機・投稿・マーカー確定・返却はすべて ci.sh 内で完結する
      - name: Run daily poster
        id: post
        env:
          TZ: Asia/Tokyo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}
          POSTS_ENDPOINT: ${{ secrets.POSTS_ENDPOINT }}
          ADVANCE_ENDPOINT: ${{ secrets.ADVANCE_ENDPOINT }}
          ADVANCE_TOKEN: ${{ secrets.ADVANCE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
          REQUIRE_MEDIA: ${{ github.event.inputs.require_media || '0' }}
          FORCE_DATE: ${{ github.event.inputs.force_date || '' }}
          WAIT_UNTIL: ${{ github.event.inputs.wait_until || '05:00' }}
        run: bash automation/x_daily/ci.sh

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-daily-log-${{ github.run_id }}
          path: automation/x_daily/last_run.log
          if-no-files-found: ignore
