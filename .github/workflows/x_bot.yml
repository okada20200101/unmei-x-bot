name: x daily post (unmei / @unmei_meishiki_)

# ============================================================
#  毎朝 05:00 JST に「1本だけ」投稿する。JST = UTC+9。
#
#  判定を待たない設計:
#   ・時刻の精度は WAIT_UNTIL が担保する（早く起動した実行は 05:00 まで待つ）
#   ・投稿の重複は last_post.txt（JST日付）が担保する
#   ・命式と偉人は日付から決定論的に算出（外部サーバーのカーソルに依存しない）
#   ・動画は素材サーバーの n = 偉人index*10 + 十干index を seek して取得
#
#  schedule を4本置く理由:
#   GitHub の schedule は実測 +2h41m〜+5h39m 遅れる。1本だと 05:00 を
#   跨いで遅れる日が出るため、窓をずらして4本置き、どれか1本が 05:00 前に
#   起動すればよい構成にする。concurrency で直列化されるので、
#   待機するのは常に1本だけ（残りは投稿後に走って即 skip）。
# ============================================================

on:
  schedule:
    # 23:00 / 00:30 / 02:00 / 06:30 JST 仕掛け
    #   → 実起動 01:41〜07:39 JST の範囲に散る。05:00 より前のものは待機する。
    - cron: "0 14 * * *"
    - cron: "30 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 投稿せず検証だけ"
        default: "0"
      probe:
        description: "1 = 添付テストのみ (投稿しない)"
        default: "0"
      require_media:
        description: "1 = 動画が付かなければ投稿せず中止"
        default: "0"
      wait_until:
        description: "HH:MM (JST) まで待ってから投稿。空なら 05:00"
        default: ""
      force_date:
        description: "検証用 YYYY-MM-DD（空なら今日）"
        default: ""

concurrency:
  group: x-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 二重投稿ガード ----
      # last_post.txt の1語目（JST日付）が今日なら黙って降りる。
      # 2語目は発火元（workflow_dispatch / schedule）で、事後の判定に使う。
      - name: Duplicate guard
        id: guard
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Tokyo date +%F)
          F=automation/x_daily/last_post.txt
          LAST=""
          if [ -f "$F" ]; then LAST=$(head -n1 "$F" | awk '{print $1}'); fi
          echo "marker=${LAST:-<none>} today=$TODAY"
          if [ "$DRY_RUN" = "1" ] || [ "$PROBE" = "1" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "検証モード → ガード素通り"; exit 0
          fi
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "本日($TODAY)は投稿済み → スキップ"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "未投稿(marker=${LAST:-none}) → 実行"
          fi

      # ---- 投稿（ci.sh 内で WAIT_UNTIL まで待機）----
      - name: Run daily poster
        id: post
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Tokyo
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}
          POSTS_ENDPOINT: ${{ secrets.POSTS_ENDPOINT }}
          ADVANCE_ENDPOINT: ${{ secrets.ADVANCE_ENDPOINT }}
          ADVANCE_TOKEN: ${{ secrets.ADVANCE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
          REQUIRE_MEDIA: ${{ github.event.inputs.require_media || '0' }}
          FORCE_DATE: ${{ github.event.inputs.force_date || '' }}
          WAIT_UNTIL: ${{ github.event.inputs.wait_until || '05:00' }}
        run: bash automation/x_daily/ci.sh

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-daily-log
          path: |
            automation/x_daily/last_run.log
          if-no-files-found: ignore

      # ---- 記録・STATUS.md 更新・コミット ----
      # 実際に投稿できた時だけ日付を書く。dry_run/probe/失敗時は書かない。
      - name: Record & commit
        if: success() && steps.guard.outputs.skip != 'true' && steps.post.outcome == 'success' && github.event.inputs.dry_run != '1' && github.event.inputs.probe != '1'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          F=automation/x_daily/last_post.txt
          NOW=$(TZ=Asia/Tokyo date +'%F %H:%M')
          echo "${NOW%% *} ${EVENT_NAME}" > "$F"
          echo "$NOW event=${EVENT_NAME} run=${{ github.run_id }} actor=${{ github.actor }}" > automation/x_daily/last_trigger.txt
          POST_TIME="${NOW##* }" python3 automation/x_daily/record.py
          git config user.name  "x-bot"
          git config user.email "x-bot@users.noreply.github.com"
          git add "$F" automation/x_daily/last_trigger.txt automation/x_daily/history.jsonl STATUS.md
          git commit -m "post $(cat "$F")" || echo "no changes"
          git push
