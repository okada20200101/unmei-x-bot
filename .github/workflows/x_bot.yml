name: x daily post (unmei / @unmei_meishiki_)

# 毎朝 5:00 JST = 20:00 UTC (前日)。JST = UTC+9。
# 対象アカウント: @unmei_meishiki_ (@iching_kobo とは別アカウント・完全独立)
#
# ============================================================
#  真因（2026-10-20）: PAT unmei-x-bot-deploy の期限切れ
#
#  旧構成は on: workflow_dispatch のみ。
#  Cloudflare Cron (unmei-x-trigger) が 20:00 UTC に PAT で
#  workflow_dispatch を叩く設計だったため、PAT が失効した瞬間に
#  トリガーごと死んで「投稿ゼロ」になった。
#
#  対策:
#   1) schedule を「保険」として復活（PAT 不要）
#      ※ GitHub の schedule は 2〜5時間遅延する。05:00 に間に合わない
#        ことはあるが、投稿がゼロになるよりは良い。
#   2) 二重投稿ガード: Worker の /diag を見て、当日すでに配信済みなら
#      スキップする（ローカル state に依存しないので確実）。
#   3) 既存の入力 (dry_run / probe / require_media / wait_until) は
#      ci.sh が参照しているため全て維持。
# ============================================================

on:
  schedule:
    # 5:00 JST (20:00 UTC) に「必ず」投稿するための二重化。どちらか早く来た方が 05:00 まで待って投稿する。
    #
    # 実測した GitHub schedule の遅延: +2h41m 〜 +5h39m（平均 +3h37m）。
    #   16:00 UTC (01:00 JST) 仕掛け → 起動 18:41〜21:39 UTC（03:41〜06:39 JST）
    #     → 05:00 より前に起動すれば WAIT_UNTIL で 05:00 まで待機＝ちょうど5:00に投稿
    #   Cloudflare Cron (unmei-x-trigger) は別系統で 19:50/20:00 UTC に叩く（PAT使用）
    #   → 3系統のどれが先に来ても、5:00 に1本だけ。
    #
    # 21:30 UTC は最終保険。ここまで来る＝両方が落ちた時だけ（07:00頃投稿）。
    - cron: "0 16 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 投稿せず検証だけ"
        default: "0"
      probe:
        description: "1 = 添付テストのみ (投稿しない)"
        default: "0"
      require_media:
        description: "1 = 動画が付かなければ投稿せず中止"
        default: "0"
      wait_until:
        description: "HH:MM (JST) その時刻まで待ってから投稿。例 05:20"
        default: ""

concurrency:
  group: x-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 二重投稿ガード（リポジトリ内マーカー方式）----
      # 投稿に成功したら automation/x_daily/last_post.txt に JST の日付を
      # コミットする。次の実行はそれを見て、同じ日なら黙って降りる。
      # Worker の /diag に依存しないので、Worker 側が何であれ確実に効く。
      # 副次効果: 毎日コミットが入るため、60日無活動で schedule が
      #           自動停止する GitHub の仕様も回避できる。
      - name: Duplicate guard (already posted today?)
        id: guard
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          # どのトリガーが先に来ても 05:00 JST ちょうどに揃える（ci.sh が待機）
          WAIT_UNTIL: "05:00"
          PROBE: ${{ github.event.inputs.probe || '0' }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Tokyo date +%F)
          F=automation/x_daily/last_post.txt
          # マーカーは「JST日付 トリガー種別」の2語。日付だけを比較する。
          LAST=""
          if [ -f "$F" ]; then LAST=$(head -n1 "$F" | awk '{print $1}'); fi
          echo "marker=${LAST:-<none>} today=$TODAY"
          if [ "$DRY_RUN" = "1" ] || [ "$PROBE" = "1" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "dry_run/probe のためガードを素通り"
            exit 0
          fi
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "本日 ($TODAY) は投稿済み → スキップ"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "未投稿 (marker=${LAST:-none}) → 実行する"
          fi

      # wait_until 指定時はその時刻まで待つ（Cloudflare 経由の呼び出しと互換）
      - name: Wait until (optional)
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.wait_until != ''
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.wait_until }}"
          NOW=$(TZ=Asia/Tokyo date +%s)
          WANT=$(TZ=Asia/Tokyo date -d "$(TZ=Asia/Tokyo date +%F) ${TARGET}" +%s)
          DIFF=$(( WANT - NOW ))
          if [ "$DIFF" -gt 0 ] && [ "$DIFF" -lt 21600 ]; then
            echo "${TARGET} JST まで ${DIFF} 秒待機します"
            sleep "$DIFF"
          else
            echo "待機不要 (diff=${DIFF}s)"
          fi

      - name: Run daily poster
        id: post
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Tokyo
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}
          POSTS_ENDPOINT: ${{ secrets.POSTS_ENDPOINT }}
          ADVANCE_ENDPOINT: ${{ secrets.ADVANCE_ENDPOINT }}
          ADVANCE_TOKEN: ${{ secrets.ADVANCE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          # どのトリガーが先に来ても 05:00 JST ちょうどに揃える（ci.sh が待機）
          WAIT_UNTIL: "05:00"
          PROBE: ${{ github.event.inputs.probe || '0' }}
          REQUIRE_MEDIA: ${{ github.event.inputs.require_media || '0' }}
        run: bash automation/x_daily/ci.sh

      - name: Upload log & state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-daily-state
          path: |
            automation/x_daily/state.json
            automation/x_daily/last_run.log
          if-no-files-found: ignore

      # ---- 投稿済みマーカーを記録 ----
      # 実際に投稿できた時だけ日付を書いてコミットする。
      # dry_run / probe / 失敗時は書かない（＝翌日もきちんと投稿される）。
      - name: Mark as posted
        if: success() && steps.guard.outputs.skip != 'true' && steps.post.outcome == 'success' && github.event.inputs.dry_run != '1' && github.event.inputs.probe != '1'
        run: |
          set -euo pipefail
          F=automation/x_daily/last_post.txt
          # 日付 ＋ 発火元(event_name) を書く。
          #   workflow_dispatch = Cloudflare の PAT が生きている証拠
          #   schedule          = GitHub 側の cron が拾った（＝Cloudflare は死んでいる）
          echo "$(TZ=Asia/Tokyo date +%F) ${{ github.event_name }}" > "$F"
          echo "$(TZ=Asia/Tokyo date +'%F %H:%M') event=${{ github.event_name }} run=${{ github.run_id }} actor=${{ github.actor }}" > automation/x_daily/last_trigger.txt
          echo "marker -> $(cat "$F")"
          echo "trigger -> $(cat automation/x_daily/last_trigger.txt)"
          git config user.name  "x-bot"
          git config user.email "x-bot@users.noreply.github.com"
          git add "$F" automation/x_daily/last_trigger.txt
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "x_daily: 投稿済みマーカー $(cat "$F")"
          git push origin HEAD:main
